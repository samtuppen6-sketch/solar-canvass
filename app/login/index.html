<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solpath — Team Login</title>
<link rel="icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: #0c1628;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 24px;
    font-weight: 800;
    color: #fff;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 40px;
  }
  .logo-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; }
  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 48px 40px;
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  h1 { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800; margin-bottom: 8px; }
  p { font-size: 14px; color: #94a3b8; margin-bottom: 32px; line-height: 1.6; }
  .form-group { margin-bottom: 16px; text-align: left; }
  label { font-size: 13px; font-weight: 500; color: #cbd5e1; display: block; margin-bottom: 6px; }
  input {
    width: 100%;
    background: #132040;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 14px;
    color: #fff;
    font-family: 'Inter', sans-serif;
  }
  input:focus { outline: none; border-color: rgba(34,197,94,0.4); }
  .btn {
    width: 100%;
    padding: 14px;
    background: #22c55e;
    color: #000;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    margin-top: 8px;
    text-decoration: none;
    display: block;
    transition: background 0.2s;
  }
  .btn:hover { background: #16a34a; }
  .divider { margin: 24px 0; font-size: 12px; color: #64748b; }
  .btn-outline {
    width: 100%;
    padding: 13px;
    background: transparent;
    color: #cbd5e1;
    font-size: 14px;
    font-weight: 500;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    text-decoration: none;
    display: block;
    transition: all 0.2s;
  }
  .btn-outline:hover { background: rgba(255,255,255,0.04); }
  .back { margin-top: 24px; font-size: 13px; color: #64748b; }
  .back a { color: #94a3b8; text-decoration: none; }
  .back a:hover { color: #fff; }
</style>
</head>
<body>
  <a href="/" class="logo"><span class="logo-dot"></span>Solpath</a>
  <div class="card">
    <h1>Team Login</h1>
    <p>Enter your access code or email to continue to the canvassing platform.</p>
    <div class="form-group">
      <label>Email</label>
      <input type="email" placeholder="your@email.com" id="email">
    </div>
    <div class="form-group">
      <label>Password / Access Code</label>
      <input type="password" placeholder="••••••••" id="pass">
    </div>
    <button class="btn" onclick="doLogin()">Open App →</button>
    <div class="divider">or</div>
    <a href="/app/pass" class="btn-outline">Buy a Day Pass or Week Pass</a>
  </div>
  <div class="back"><a href="/">← Back to solpath.energy</a></div>
  <script>
    function doLogin() {
      const e = (document.getElementById('email').value||'').trim().toLowerCase();
      const p = (document.getElementById('pass').value||'').trim().toLowerCase();
      // Any demo login → manager dashboard in demo mode (dashboard-first walkthrough; nothing saved)
      if (p === 'demo' && (e === 'demo.manager@solpath.energy' || e === 'demo@solpath.energy' || e === 'demo')) {
        window.location.href = '/app/manager?demo=1'; return;
      }
      // Route to app — access validation happens inside the app
      if (e || p) {
        window.location.href = '/app/?ref=login';
      }
    }
    document.addEventListener('keydown', ev => { if (ev.key === 'Enter') doLogin(); });
  </script>
</body>
</html>
