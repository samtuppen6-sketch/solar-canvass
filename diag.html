<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EPC API Diagnostic</title>
<style>
body{font-family:monospace;background:#111;color:#0f0;padding:16px;font-size:13px}
h2{color:#f59e0b;margin-bottom:12px}
.test{background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:12px;margin-bottom:10px}
.ok{color:#22c55e}.fail{color:#ef4444}.info{color:#9ca3af}
button{background:#f59e0b;border:none;border-radius:8px;padding:10px 20px;font-size:14px;font-weight:700;cursor:pointer;color:#000;margin-bottom:16px;width:100%}
</style>
</head>
<body>
<h2>☀ EPC API Diagnostic</h2>
<p class="info">This page tests your EPC key directly from your browser.</p>
<br>
<button onclick="runTests()">▶ Run All Tests</button>
<div id="results"></div>
<script>
const KEY = "fDuEL3O8Cq0mHbpeALVFxT680aof4xyKYRcSqJnxCQ9JDmy6Rwpr11MLKTIAGEkU";
const PC = "PO1 1AN";
const enc = encodeURIComponent(PC);
const BASE = "https://get-energy-performance-data.communities.gov.uk";

async function test(name, url, headers) {
  const div = document.createElement('div');
  div.className = 'test';
  div.innerHTML = `<b class="info">Testing: ${name}</b><br>URL: ${url.slice(0,80)}...`;
  document.getElementById('results').appendChild(div);
  try {
    const r = await fetch(url, {headers});
    const body = await r.text();
    const cls = r.ok ? 'ok' : 'fail';
    div.innerHTML += `<br><span class="${cls}">Status: ${r.status}</span>`;
    div.innerHTML += `<br>Body: ${body.slice(0,200)}`;
    if(r.ok) {
      try {
        const d = JSON.parse(body);
        const rows = d.rows||d.certificates||d.data||[];
        div.innerHTML += `<br><span class="ok">✓ SUCCESS - ${rows.length} properties found!</span>`;
      } catch(e) {}
    }
  } catch(e) {
    div.innerHTML += `<br><span class="fail">Error: ${e.message}</span>`;
  }
}

async function runTests() {
  document.getElementById('results').innerHTML = '';
  const tests = [
    ["Bearer token", `${BASE}/api/domestic/search?postcode=${enc}&size=5`, {"Authorization": `Bearer ${KEY}`, "Accept": "application/json"}],
    ["Token only", `${BASE}/api/domestic/search?postcode=${enc}&size=5`, {"Authorization": KEY, "Accept": "application/json"}],
    ["api-key header", `${BASE}/api/domestic/search?postcode=${enc}&size=5`, {"api-key": KEY, "Accept": "application/json"}],
    ["x-api-key header", `${BASE}/api/domestic/search?postcode=${enc}&size=5`, {"x-api-key": KEY, "Accept": "application/json"}],
    ["Bearer v1", `${BASE}/api/v1/domestic/search?postcode=${enc}&size=5`, {"Authorization": `Bearer ${KEY}`, "Accept": "application/json"}],
    ["No auth - see CORS", `${BASE}/api/domestic/search?postcode=${enc}&size=5`, {"Accept": "application/json"}],
  ];
  for(const [name, url, hdrs] of tests) {
    await test(name, url, hdrs);
    await new Promise(r => setTimeout(r, 300));
  }
}
</script>
</body></html>
