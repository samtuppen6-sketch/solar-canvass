<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EPC Proxy Diagnostic</title>
<style>
body{font-family:monospace;background:#111;color:#0f0;padding:16px;font-size:12px;word-break:break-all}
h2{color:#f59e0b}
.box{background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:12px;margin-bottom:10px}
.ok{color:#22c55e}.fail{color:#ef4444}.warn{color:#f59e0b}
button{background:#f59e0b;border:none;border-radius:8px;padding:12px 20px;font-size:14px;font-weight:700;cursor:pointer;color:#000;width:100%;margin-bottom:12px}
pre{white-space:pre-wrap;font-size:11px;margin-top:8px}
</style></head>
<body>
<h2>☀ EPC Proxy Diagnostic v2</h2>
<p style="color:#9ca3af">Tests the Supabase proxy against the EPC API</p>
<br>
<button onclick="run()">▶ Run Diagnostic</button>
<div id="out"></div>
<script>
const PROXY = "https://xdoqclrwdduncjaxtixp.supabase.co/functions/v1/epc-proxy";

function log(html) {
  document.getElementById('out').innerHTML += html;
}

async function run() {
  document.getElementById('out').innerHTML = '';
  log('<div class="box"><b class="warn">Testing proxy: ' + PROXY + '</b></div>');
  
  const postcodes = ['PO1 1AN', 'PO5 1NU', 'PO6 3LX'];
  
  for(const pc of postcodes) {
    log(`<div class="box"><b>Postcode: ${pc}</b>`);
    try {
      const url = PROXY + '?postcode=' + encodeURIComponent(pc) + '&size=3';
      log(`<br>URL: ${url}`);
      
      const r = await fetch(url);
      const body = await r.text();
      
      log(`<br><span class="${r.ok ? 'ok' : 'fail'}">Status: ${r.status} ${r.statusText}</span>`);
      log(`<br>Content-Type: ${r.headers.get('content-type') || 'none'}`);
      log(`<pre>${body.slice(0, 800)}</pre>`);
      
      if(r.ok) {
        try {
          const d = JSON.parse(body);
          const rows = d.rows || d.certificates || d.data || [];
          log(`<br><span class="ok">✓ PARSED OK - ${rows.length} rows found</span>`);
          if(rows.length > 0) {
            log(`<br>First row keys: ${Object.keys(rows[0]).join(', ')}`);
            log(`<br>Sample: ${JSON.stringify(rows[0]).slice(0,200)}`);
          }
        } catch(e) {
          log(`<br><span class="warn">JSON parse failed: ${e.message}</span>`);
        }
      }
    } catch(e) {
      log(`<br><span class="fail">FETCH ERROR: ${e.message}</span>`);
    }
    log('</div>');
  }
  log('<div class="box ok">✓ Diagnostic complete</div>');
}
</script>
</body></html>
